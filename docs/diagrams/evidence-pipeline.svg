<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Firebreak evidence pipeline</title>
  <desc id="desc">Five stages from public NASA records to a cited decision: retrieve, check coverage, estimate severity, apply rules, and cite. Only severity is learned; it cannot write the grade.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .sans { font-family: "Segoe UI", Inter, system-ui, sans-serif; }
    .mono { font-family: Consolas, "Cascadia Mono", "Liberation Mono", monospace; }
    .name { font-size: 23px; font-weight: 700; fill: #1c1e22; }
    .impl { font-size: 12px; fill: #5f636b; }
    .metric { font-size: 11.5px; fill: #2a2c31; }
    .num { font-size: 11px; fill: #c2410c; letter-spacing: 1.4px; }
    .flow { stroke: #8f8a7d; stroke-width: 1; stroke-dasharray: 3 7; }
    @media (prefers-reduced-motion: no-preference) {
      .flow { animation: dash 16s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -220; } }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; }
    }
  </style>

  <rect width="1200" height="400" fill="#f7f4ec"/>
  <rect x="0.5" y="0.5" width="1199" height="399" fill="none" stroke="#e6e1d5"/>

  <text x="48" y="50" class="mono" font-size="11" fill="#c2410c" letter-spacing="2.2">THE EVIDENCE PIPELINE</text>
  <text x="48" y="80" class="serif" font-size="19" fill="#2a2c31">One deterministic chain from public record to a cited decision.</text>
  <text x="1152" y="50" class="mono" font-size="10" fill="#6f727a" text-anchor="end">OFFLINE · NO API KEYS</text>

  <line class="flow" x1="158" y1="182" x2="1036" y2="182"/>
  <path d="M1036 182 l-9 -4 v8 z" fill="#8f8a7d"/>

  <g class="node">
    <text x="158" y="148" class="mono num" text-anchor="middle">01</text>
    <circle cx="158" cy="182" r="5" fill="#f7f4ec" stroke="#1c1e22" stroke-width="1.5"/>
    <text x="158" y="216" class="serif name" text-anchor="middle">Retrieve</text>
    <text x="158" y="243" class="sans impl" text-anchor="middle">TF-IDF over material,</text>
    <text x="158" y="259" class="sans impl" text-anchor="middle">environment, outcome</text>
    <line x1="108" y1="292" x2="208" y2="292" stroke="#d8d2c4"/>
    <text x="158" y="314" class="mono metric" text-anchor="middle">recall@3 1.00</text>
    <text x="158" y="330" class="mono metric" text-anchor="middle">0 false matches</text>
  </g>

  <g class="node">
    <text x="379" y="148" class="mono num" text-anchor="middle">02</text>
    <circle cx="379" cy="182" r="5" fill="#f7f4ec" stroke="#1c1e22" stroke-width="1.5"/>
    <text x="379" y="216" class="serif name" text-anchor="middle">Check coverage</text>
    <text x="379" y="243" class="sans impl" text-anchor="middle">Gravity, pressure, and</text>
    <text x="379" y="259" class="sans impl" text-anchor="middle">oxygen envelope match</text>
    <line x1="329" y1="292" x2="429" y2="292" stroke="#d8d2c4"/>
    <text x="379" y="314" class="mono metric" text-anchor="middle">5 / 5 held-out</text>
    <text x="379" y="330" class="mono metric" text-anchor="middle">targets found</text>
  </g>

  <g class="node">
    <rect x="576" y="102" width="48" height="16" fill="#c2410c"/>
    <text x="600" y="113.5" class="mono" font-size="8.5" fill="#f7f4ec" text-anchor="middle" letter-spacing=".8">LEARNED</text>
    <text x="600" y="148" class="mono num" text-anchor="middle">03</text>
    <circle cx="600" cy="182" r="5" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/>
    <text x="600" y="216" class="serif name" text-anchor="middle">Screen severity</text>
    <text x="600" y="243" class="sans impl" text-anchor="middle">Gradient-boosted,</text>
    <text x="600" y="259" class="sans impl" text-anchor="middle">monotonic in O₂</text>
    <line x1="550" y1="292" x2="650" y2="292" stroke="#d8d2c4"/>
    <text x="600" y="314" class="mono metric" text-anchor="middle">AUC 0.811</text>
    <text x="600" y="330" class="mono metric" text-anchor="middle">vs 0.605 O₂-only</text>
  </g>

  <g class="node">
    <text x="821" y="148" class="mono num" text-anchor="middle">04</text>
    <circle cx="821" cy="182" r="5" fill="#f7f4ec" stroke="#1c1e22" stroke-width="1.5"/>
    <text x="821" y="216" class="serif name" text-anchor="middle">Apply rules</text>
    <text x="821" y="243" class="sans impl" text-anchor="middle">Ten rules R1–R10</text>
    <text x="821" y="259" class="sans impl" text-anchor="middle">over evidence strength</text>
    <line x1="771" y1="292" x2="871" y2="292" stroke="#d8d2c4"/>
    <text x="821" y="314" class="mono metric" text-anchor="middle">A–D grade</text>
    <text x="821" y="330" class="mono metric" text-anchor="middle">+ blocking gap</text>
  </g>

  <g class="node">
    <text x="1042" y="148" class="mono num" text-anchor="middle">05</text>
    <circle cx="1042" cy="182" r="5" fill="#f7f4ec" stroke="#1c1e22" stroke-width="1.5"/>
    <text x="1042" y="216" class="serif name" text-anchor="middle">Cite</text>
    <text x="1042" y="243" class="sans impl" text-anchor="middle">Record IDs, pages,</text>
    <text x="1042" y="259" class="sans impl" text-anchor="middle">standard clauses</text>
    <line x1="992" y1="292" x2="1092" y2="292" stroke="#d8d2c4"/>
    <text x="1042" y="314" class="mono metric" text-anchor="middle">60 / 60 audit</text>
    <text x="1042" y="330" class="mono metric" text-anchor="middle">fields correct</text>
  </g>

  <text x="48" y="372" class="mono" font-size="10" fill="#6f727a">Only stage 03 is learned. It screens one BASS-II outcome and cannot write the grade.</text>
  <text x="1152" y="372" class="mono" font-size="10" fill="#6f727a" text-anchor="end">PSI + NTRS + NASA-STD-6001 · 1,170 records · 11 investigations</text>
</svg>
