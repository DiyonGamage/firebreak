<meta name="theme-color" content="#f7f4ec">
<script>
(function () {
  var root = document.documentElement;
  var stored = null;
  try { stored = localStorage.getItem('firebreak-theme'); } catch (e) {}
  var theme = stored === 'dark' || stored === 'light'
    ? stored
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.dataset.theme = theme;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#191916' : '#f7f4ec');

  function paint() {
    var dark = root.dataset.theme === 'dark';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#191916' : '#f7f4ec');
    var button = document.querySelector('[data-theme-toggle]');
    if (!button) return;
    button.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    var label = button.querySelector('.themetoggle-label');
    if (label) label.textContent = dark ? 'Light' : 'Dark';
  }

  document.addEventListener('DOMContentLoaded', function () {
    paint();

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce && 'IntersectionObserver' in window) {
      var style = document.createElement('style');
      style.textContent =
        '.fx{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}' +
        '.fx.fx-in{opacity:1;transform:none}';
      document.head.appendChild(style);
      var seen = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('fx-in');
          seen.unobserve(entry.target);
        });
      }, { rootMargin: '0px 0px -8% 0px' });
      document.querySelectorAll('main > section, main > article').forEach(function (node, index) {
        node.classList.add('fx');
        node.style.transitionDelay = Math.min(index, 3) * 45 + 'ms';
        seen.observe(node);
      });
    }
    document.addEventListener('click', function (event) {
      var button = event.target.closest('[data-theme-toggle]');
      if (!button) return;
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('firebreak-theme', root.dataset.theme); } catch (e) {}
      paint();
    });
  });
})();
</script>
